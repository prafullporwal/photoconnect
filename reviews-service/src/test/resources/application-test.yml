# =============================================================================
# Test profile — replaces real external dependencies with in-memory stubs so
# the context loads without PostgreSQL, Eureka, or the Config Server running.
# =============================================================================

spring:
  config:
    import: ""           # skip the configserver import entirely
  cloud:
    config:
      enabled: false     # don't try to fetch from config-service
  datasource:
    url: jdbc:h2:mem:reviewsdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop   # let Hibernate build the schema from entities
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false        # H2 doesn't run the Postgres-flavoured V1 script

eureka:
  client:
    enabled: false        # no Eureka in unit/smoke tests
