# =============================================================================
# reviews-service - embedded bootstrap config
# =============================================================================
# Only the bare minimum to bring the JVM up far enough to call Config Server.
# Real settings live in config-repo/reviews-service.properties.
# =============================================================================
spring.application.name=reviews-service
spring.profiles.default=local

# Pull authoritative settings from Config Server. 'optional:' = keep booting if down.
spring.config.import=optional:configserver:http://localhost:8888

spring.cloud.config.profile=${spring.profiles.active:local}
spring.cloud.config.fail-fast=false
spring.cloud.config.retry.max-attempts=6
spring.cloud.config.retry.initial-interval=1000
spring.cloud.config.retry.max-interval=2000
spring.cloud.config.retry.multiplier=1.1

# Fallback port if config-server is unreachable
server.port=8084

# Flyway owns the schema; Hibernate just validates that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# -----------------------------------------------------------------------------
# Feign default timeouts (overridable per-client via config-repo)
# -----------------------------------------------------------------------------
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=5000

# -----------------------------------------------------------------------------
# Service-to-service client bootstrap defaults — config-repo overrides these
# with the real values once Config Server is reachable.
# -----------------------------------------------------------------------------
reviews.service-client.client-id=reviews-service
reviews.service-client.client-secret=reviews-service-dev-secret
reviews.service-client.auth-service-url=http://auth-service
reviews.service-client.refresh-skew=PT10S
