# =============================================================================
# PhotoConnect - Local Infrastructure (+ optional Java apps)
# =============================================================================
# Default `docker compose up -d` brings up ONLY the infra services (Postgres,
# MySQL, Redis, MinIO, Zipkin) — same as before. Java apps stay in your IDE.
#
# To also start the Java app services (used by Jenkins CD and for full-stack
# local smoke tests), add --profile apps:
#   docker compose --profile apps up -d --build
#
# Tear everything down:   docker compose --profile apps down
# Wipe volumes too:       docker compose --profile apps down -v
#
# Ports exposed to host:
#   5432  PostgreSQL (auth_db + photographer_db)
#   3306  MySQL      (customer_db)
#   6379  Redis      (token blacklist, rate limiting)
#   9000  MinIO S3 API
#   9001  MinIO Web Console
#   9411  Zipkin UI
#   8080  api-gateway        (profile: apps)
#   8081  auth-service       (profile: apps)
#   8761  discovery-service  (profile: apps)
#   8888  config-service     (profile: apps)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL — shared by auth-service and photographer-service.
  # Each service gets its OWN database (database-per-service pattern) so we
  # keep schema ownership clean even though they share a Postgres instance.
  # In Phase 2 you can promote them to separate RDS instances without code changes.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: pc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # Comma-separated list parsed by our init script:
      POSTGRES_MULTIPLE_DATABASES: auth_db,photographer_db,reviews_db
    ports:
      - "5432:5432"
    volumes:
      - pc_postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [pc-net]

  # ---------------------------------------------------------------------------
  # MySQL — used by customer-service.
  # Why a different DB engine? Because in real teams, services pick their own
  # storage and the platform shouldn't dictate. This also forces us to confirm
  # that our cross-cutting code (Flyway, JPA dialects) works against multiple
  # engines from day one.
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.4
    container_name: pc-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: customer_db
      MYSQL_USER: customer_user
      MYSQL_PASSWORD: customer_pass
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # MySQL 8.4 removed --default-authentication-plugin; caching_sha2_password
      # is now the default anyway. To pin it explicitly use --authentication-policy.
      - --authentication-policy=caching_sha2_password
    volumes:
      - pc_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [pc-net]

  # ---------------------------------------------------------------------------
  # Redis — JWT refresh-token blacklist + (later) rate limiting at the gateway.
  # In Phase 2 this becomes AWS ElastiCache (Redis-compatible) with zero code
  # change — connection string only.
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: pc-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - pc_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [pc-net]

  # ---------------------------------------------------------------------------
  # MinIO — S3-compatible object storage running locally.
  # The AWS SDK v2 talks to MinIO over the exact same S3 API; we just point
  # the endpoint URL at MinIO in the `local` profile and at real S3 in `aws`.
  # No application code changes between environments.
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: pc-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console at http://localhost:9001
    volumes:
      - pc_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [pc-net]

  # One-shot job: creates the bucket(s) our services expect, so a fresh
  # `docker compose up` is immediately usable.
  minio-init:
    image: minio/mc:latest
    container_name: pc-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/photoconnect-media &&
      mc anonymous set download local/photoconnect-media &&
      echo 'MinIO bucket ready: photoconnect-media' &&
      exit 0
      "
    networks: [pc-net]

  # ---------------------------------------------------------------------------
  # Zipkin — distributed tracing UI.
  # Spring Boot's Micrometer Tracing will push spans here over HTTP.
  # Open http://localhost:9411 to follow a request across services by traceId.
  # ---------------------------------------------------------------------------
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: pc-zipkin
    restart: unless-stopped
    ports:
      - "9411:9411"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9411/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [pc-net]

  # ===========================================================================
  # JAVA APP SERVICES — profile: apps
  # ===========================================================================
  # All four are gated behind `--profile apps` so the default
  # `docker compose up -d` keeps the lightweight infra-only flow used during
  # local dev. Jenkins's Deploy stage opts in with --profile apps.
  #
  # Boot order is enforced by depends_on with `condition: service_healthy`:
  #   discovery-service ─┐
  #   config-service ────┼─► auth-service ──► api-gateway
  #   postgres, redis ───┘
  #
  # Each Dockerfile builds from the repo root (context: .) and references
  # its module's pom.xml + sources. The Maven build runs inside the image,
  # so the host doesn't need Maven — only Docker.
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # discovery-service — Eureka registry. Foundation service: no Spring deps.
  # ---------------------------------------------------------------------------
  discovery-service:
    profiles: [apps]
    image: photoconnect/discovery-service:dev
    build:
      context: .
      dockerfile: discovery-service/Dockerfile
    container_name: pc-discovery-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: local
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [pc-net]

  # ---------------------------------------------------------------------------
  # config-service — Spring Cloud Config Server (native filesystem backend).
  # Mounts the repo-root config-repo/ folder read-only so served properties
  # always match what's checked in.
  # ---------------------------------------------------------------------------
  config-service:
    profiles: [apps]
    image: photoconnect/config-service:dev
    build:
      context: .
      dockerfile: config-service/Dockerfile
    container_name: pc-config-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: local
    volumes:
      - ./config-repo:/app/config-repo:ro
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8888/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [pc-net]

  # ---------------------------------------------------------------------------
  # auth-service — issues JWTs, manages user accounts. Reads upstream config
  # from config-service and registers itself with discovery-service. The host
  # overrides (SPRING_DATASOURCE_URL, EUREKA_..., etc.) swap localhost for the
  # compose-internal DNS names because config-repo defaults assume localhost.
  # ---------------------------------------------------------------------------
  auth-service:
    profiles: [apps]
    image: photoconnect/auth-service:dev
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: pc-auth-service
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      discovery-service: { condition: service_healthy }
      config-service: { condition: service_healthy }
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-service:8888
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_db
      SPRING_DATA_REDIS_HOST: redis
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-service:8761/eureka/
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      AUTH_PRIVATE_KEY_PATH: /app/keys/private_key.pem
      AUTH_PUBLIC_KEY_PATH: /app/keys/public_key.pem
    volumes:
      - ./auth-service/keys:/app/keys:ro
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    networks: [pc-net]

  # ---------------------------------------------------------------------------
  # api-gateway — edge service, validates JWTs (needs auth-service's public
  # key on disk) and routes to backend services via Eureka load-balancing.
  # Shares the keys volume with auth-service so both read the same key file.
  # ---------------------------------------------------------------------------
  api-gateway:
    profiles: [apps]
    image: photoconnect/api-gateway:dev
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: pc-api-gateway
    restart: unless-stopped
    depends_on:
      discovery-service: { condition: service_healthy }
      config-service: { condition: service_healthy }
      auth-service: { condition: service_healthy }
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-service:8888
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-service:8761/eureka/
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      AUTH_PUBLIC_KEY_PATH: /app/keys/public_key.pem
    volumes:
      - ./auth-service/keys:/app/keys:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    networks: [pc-net]

# Named volumes survive `docker compose down`. Use `down -v` to wipe them.
volumes:
  pc_postgres_data:
  pc_mysql_data:
  pc_redis_data:
  pc_minio_data:

networks:
  pc-net:
    driver: bridge
    name: pc-net
