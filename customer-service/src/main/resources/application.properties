# =============================================================================
# customer-service - embedded bootstrap config
# =============================================================================
spring.application.name=customer-service
spring.profiles.default=local

# Pull authoritative settings from Config Server. 'optional:' = keep booting if down.
spring.config.import=optional:configserver:http://localhost:8888

spring.cloud.config.profile=${spring.profiles.active:local}
spring.cloud.config.fail-fast=false
spring.cloud.config.retry.max-attempts=6
spring.cloud.config.retry.initial-interval=1000
spring.cloud.config.retry.max-interval=2000
spring.cloud.config.retry.multiplier=1.1

# Fallback port if config-server is unreachable
server.port=8083

# Flyway owns the schema; Hibernate just validates that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Hibernate 6 defaults UUIDs to BINARY in MySQL — but our columns are VARCHAR(36).
# Force string binding so 'user_id' inserts the canonical UUID text form.
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR

# -----------------------------------------------------------------------------
# Feign default timeouts (overridable per-client via config-repo)
# -----------------------------------------------------------------------------
# Connection timeout is short — if photographer-service is unreachable on the
# network layer, fail fast so the customer gets a 503 quickly rather than
# waiting 30s. Read timeout is longer to allow for normal request processing.
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=5000

# -----------------------------------------------------------------------------
# Service-to-service client — bootstrap defaults
# -----------------------------------------------------------------------------
# These satisfy @NotBlank on ServiceClientProperties when config-service is
# unreachable (during context-load tests, or first-boot). config-repo overrides
# them with the real values.
# -----------------------------------------------------------------------------
customer.service-client.client-id=customer-service
customer.service-client.client-secret=customer-service-dev-secret
customer.service-client.auth-service-url=http://auth-service
customer.service-client.refresh-skew=PT10S

# -----------------------------------------------------------------------------
# Service-to-service JWT verification — bootstrap defaults
# -----------------------------------------------------------------------------
# Satisfy @NotBlank on ServiceJwtProperties so context-load tests and the
# very-first-boot path before Config Server resolves both work. config-repo
# overrides these with the real values; the public-key path is overridden in
# tests by DynamicPropertySource (see CustomerServiceApplicationTests).
# -----------------------------------------------------------------------------
customer.service-jwt.issuer=photoconnect
customer.service-jwt.audience=photoconnect-api
customer.service-jwt.public-key-path=${AUTH_PUBLIC_KEY_PATH:auth-service/keys/public_key.pem}
