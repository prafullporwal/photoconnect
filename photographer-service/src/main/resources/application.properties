# =============================================================================
# photographer-service - embedded bootstrap config (minimal on purpose)
# =============================================================================
# Most settings (DB URL, port, actuator, Eureka URL, tracing endpoint)
# come from CONFIG-SERVICE via config-repo/photographer-service.properties.
# This file only has what's needed to REACH the config server, plus
# JPA defaults and fallback port.
# =============================================================================

spring.application.name=photographer-service
spring.profiles.default=local

# Bootstrap from Config Server. 'optional:' means: keep booting if config-service is down.
spring.config.import=optional:configserver:http://localhost:8888

spring.cloud.config.profile=${spring.profiles.active:local}
spring.cloud.config.fail-fast=false
spring.cloud.config.retry.max-attempts=6
spring.cloud.config.retry.initial-interval=1000
spring.cloud.config.retry.max-interval=2000
spring.cloud.config.retry.multiplier=1.1

# Fallback port if config-server is unreachable.
server.port=8082

# Hibernate validates the Flyway-managed schema — never modifies it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# -----------------------------------------------------------------------------
# Multipart file uploads (portfolio media)
# -----------------------------------------------------------------------------
# Spring Boot's default cap is 1MB - too small for video. We bump both the
# per-file and per-request limits to 100MB so reels and shorter videos fit.
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=110MB

# -----------------------------------------------------------------------------
# Object storage defaults (MinIO locally; overridden in config-repo)
# -----------------------------------------------------------------------------
# storage.endpoint            — S3 API URL (MinIO :9000 locally, real S3 in Phase 2)
# storage.public-url-prefix   — base URL clients use to fetch objects directly
# storage.bucket              — bucket name (created by docker-compose minio-init)
# storage.region              — required by AWS SDK; us-east-1 is MinIO's default
storage.endpoint=http://localhost:9000
storage.public-url-prefix=http://localhost:9000
storage.bucket=photoconnect-media
storage.region=us-east-1
storage.access-key=minioadmin
storage.secret-key=minioadmin
storage.path-style-access=true

# -----------------------------------------------------------------------------
# Service-to-service JWT (validation only) — bootstrap defaults
# -----------------------------------------------------------------------------
# These satisfy @NotBlank on ServiceJwtProperties when config-service is
# unreachable (during slice tests, or first-boot). config-repo overrides them.
# -----------------------------------------------------------------------------
photographer.service-jwt.issuer=photoconnect
photographer.service-jwt.audience=photoconnect-api
photographer.service-jwt.public-key-path=keys/public_key.pem
