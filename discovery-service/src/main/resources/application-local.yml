# =============================================================================
# discovery-service — LOCAL profile
# =============================================================================
# Active when running on a developer laptop (default profile).
# No overrides needed beyond the common application.yml for the Eureka server
# itself; this file exists so the structure is consistent across services and
# you have an obvious place to drop local-only tweaks.
# =============================================================================

logging:
  level:
    com.netflix.eureka: INFO
    com.netflix.discovery: INFO
    root: INFO
