# =============================================================================
# discovery-service - AWS profile (Phase 2 placeholder)
# =============================================================================
# In EKS the hostname should be the pod's resolvable name (handled by K8s
# Service DNS). Eureka can also be replaced by K8s native discovery in
# Phase 2 - to be decided then.
# =============================================================================

eureka.instance.prefer-ip-address=true
# In production, KEEP self-preservation enabled. Network partitions happen
# and you don't want to evict half your fleet because of a flapping link.
eureka.server.enable-self-preservation=true

logging.level.root=WARN
logging.level.com.photoconnect=INFO
