# =============================================================================
# discovery-service - common configuration
# =============================================================================
# Loaded for EVERY profile. Profile-specific overrides live in
# application-local.properties and application-aws.properties.
# =============================================================================

spring.application.name=discovery-service
# When SPRING_PROFILES_ACTIVE is unset, run as "local".
spring.profiles.default=local

server.port=8761
# Graceful shutdown: up to 30s for in-flight requests to finish before SIGTERM kills the JVM.
server.shutdown=graceful

# -----------------------------------------------------------------------------
# Actuator endpoints
# -----------------------------------------------------------------------------
# Expose only what we need. /health is the readiness/liveness probe target.
# -----------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true

info.app.name=${spring.application.name}
info.app.description=PhotoConnect Service Registry (Eureka Server)

# -----------------------------------------------------------------------------
# Eureka server - common settings
# -----------------------------------------------------------------------------
eureka.instance.hostname=localhost
# A Eureka server should not register with itself, nor fetch a registry FROM
# itself, in single-node mode. When you peer multiple Eureka nodes you flip
# both to true and provide service-url for the peers.
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# Self-preservation is a safety net: if Eureka stops receiving heartbeats from
# a high % of clients (often a network partition), it KEEPS the registry rather
# than evicting everything. Useful in prod, but in local dev it causes "ghost"
# entries to linger after you stop a service. Off locally.
eureka.server.enable-self-preservation=false
# Sweep stale instances every 5 seconds (default 60s) for a faster dev feedback loop.
eureka.server.eviction-interval-timer-in-ms=5000

management.info.git.mode=full
