# =============================================================================
# discovery-service — AWS profile (Phase 2 placeholder)
# =============================================================================
# We're not in Phase 2 yet, but this file LIVES IN THE CODEBASE so the
# eventual migration is just "set SPRING_PROFILES_ACTIVE=aws". When we do
# the migration, you'll fill in:
#   - peer awareness (multi-AZ Eureka cluster)
#   - DNS-based service URL discovery
#   - CloudWatch logging config
# =============================================================================

eureka:
  instance:
    # In EKS, the hostname should be the pod's resolvable name (handled by
    # K8s Service DNS). Eureka can also be replaced by K8s native discovery
    # in Phase 2 — to be decided then.
    prefer-ip-address: true
  server:
    # In production, KEEP self-preservation enabled. Network partitions happen
    # and you don't want to evict half your fleet because of a flapping link.
    enable-self-preservation: true

logging:
  level:
    root: WARN
    com.photoconnect: INFO
