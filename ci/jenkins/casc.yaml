# =============================================================================
# Jenkins Configuration as Code (JCasC)
# =============================================================================
# This file is the single source of truth for Jenkins's configuration. Anything
# you'd otherwise set via "Manage Jenkins" in the UI goes here instead.
#
# How it works:
#   1. Container boots.
#   2. configuration-as-code plugin reads $CASC_JENKINS_CONFIG (this file).
#   3. Jenkins applies every section: security realm, jobs, system settings.
#   4. If you click-change something in the UI, it gets OVERWRITTEN on next
#      boot. So always edit here, then `docker compose ... up -d --build`.
#
# Reference: https://github.com/jenkinsci/configuration-as-code-plugin
# =============================================================================

jenkins:
  systemMessage: "PhotoConnect local CI — configured via JCasC. Edit ci/jenkins/casc.yaml to change."
  numExecutors: 2

  # --- Who can log in --------------------------------------------------------
  # "local" = a Jenkins-managed user database (no LDAP/OAuth). One admin.
  # JCasC accepts plaintext here; Jenkins hashes it on first boot.
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          password: admin   # CHANGE before exposing beyond localhost

  # --- What logged-in users can do ------------------------------------------
  # "loggedInUsersCanDoAnything" = anyone authenticated has full rights.
  # Anonymous read disabled because there's nothing public to see.
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

# --- Job DSL security --------------------------------------------------------
# Job DSL is what lets us declare jobs from this YAML (see `jobs:` below). By
# default it runs in a sandbox that blocks many APIs. For a local single-admin
# Jenkins we turn the sandbox off so the DSL can do its work.
security:
  globalJobDslSecurityConfiguration:
    useScriptSecurity: false

# --- Credentials -------------------------------------------------------------
# GitHub Personal Access Token, injected from env vars (set in .env at the
# repo root — gitignored, never commit). Without this, Jenkins hits
# api.github.com anonymously (60 req/hour per IP) and branch indexing stalls
# for 4-5 minutes between calls. With it, the quota is 5000 req/hour.
#
# To generate the PAT:
#   GitHub → Settings → Developer settings → Personal access tokens (classic)
#   Scopes: repo, read:org
credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: github-pat
              username: ${GITHUB_USERNAME}
              password: ${GITHUB_PAT}
              description: "GitHub PAT — used by github-branch-source"

# --- System URL --------------------------------------------------------------
unclassified:
  location:
    url: "http://localhost:8090/"

  # --- GitHub API endpoint ---------------------------------------------------
  # Register github.com as a known endpoint with our PAT credential so every
  # API call (branch indexing, PR discovery) authenticates automatically.
  gitHubPluginConfig:
    configs:
      - name: "GitHub"
        apiUrl: "https://api.github.com"
        credentialsId: github-pat
        manageHooks: false   # don't let Jenkins create/delete webhooks on the repo

  # ThrottleOnOver = only sleep when actually about to exceed the hourly
  # quota. The default (ThrottleForNormalize) deliberately spaces requests
  # out to spread load across the hour — that's what causes the multi-minute
  # "Jenkins is attempting to evenly distribute" sleeps in the indexing log.
  gitHubConfiguration:
    apiRateLimitChecker: ThrottleOnOver

