# =============================================================================
# api-gateway - embedded bootstrap config (minimal on purpose)
# =============================================================================
# Most settings (routes, CORS, port, swagger URLs, eureka URL, tracing
# endpoint) come from CONFIG-SERVICE. This file only has what's needed to
# REACH the config server - name, profile default, import directive.
# =============================================================================

spring.application.name=api-gateway
spring.profiles.default=local

# Spring Boot 2.4+ way of bootstrapping from Config Server (replaces legacy
# bootstrap.yml). 'optional:' means: if config-service is down, keep booting
# with whatever local config we have. The aws profile overrides this to fail-fast.
spring.config.import=optional:configserver:http://localhost:8888

# Send our active profile to Config Server so it resolves the right files
# (api-gateway.properties + api-gateway-local.properties).
spring.cloud.config.profile=${spring.profiles.active:local}
spring.cloud.config.fail-fast=false
spring.cloud.config.retry.max-attempts=6
spring.cloud.config.retry.initial-interval=1000
spring.cloud.config.retry.max-interval=2000
spring.cloud.config.retry.multiplier=1.1

# Default port if config-server is unreachable and api-gateway.properties
# isn't served. (Config Server's api-gateway.properties will override this.)
server.port=8080

# -----------------------------------------------------------------------------
# JWT gateway defaults
# -----------------------------------------------------------------------------
# These satisfy @Validated on JwtGatewayProperties when Config Server isn't
# reachable (tests, cold-start before config-service is up). In any real run
# config-repo/api-gateway.properties overrides these.
# Both auth-service and the gateway must share the same RSA key pair;
# override AUTH_PUBLIC_KEY_PATH in your environment to use an absolute path.
# -----------------------------------------------------------------------------
gateway.jwt.public-key-path=auth-service/keys/public_key.pem
gateway.jwt.issuer=photoconnect
gateway.jwt.audience=photoconnect-api
gateway.jwt.public-paths[0]=/api/v1/auth/**
gateway.jwt.public-paths[1]=/actuator/**
gateway.jwt.public-paths[2]=/swagger-ui.html
gateway.jwt.public-paths[3]=/swagger-ui/**
gateway.jwt.public-paths[4]=/v3/api-docs/**
gateway.jwt.public-paths[5]=/webjars/**
gateway.jwt.public-paths[6]=/aggregate/*/v3/api-docs
