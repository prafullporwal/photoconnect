# =============================================================================
# auth-service - embedded bootstrap config (minimal on purpose)
# =============================================================================
# Most settings (DB URL, JWT issuer, Eureka URL, tracing endpoint, actuator)
# come from CONFIG-SERVICE via the config-repo/auth-service.properties file.
# This file only has what's needed to REACH the config server.
# =============================================================================

spring.application.name=auth-service
spring.profiles.default=local

# Bootstrap from Config Server (replaces legacy bootstrap.yml).
# 'optional:' means: if config-service is down, keep booting with local config.
spring.config.import=optional:configserver:http://localhost:8888

spring.cloud.config.profile=${spring.profiles.active:local}
spring.cloud.config.fail-fast=false
spring.cloud.config.retry.max-attempts=6
spring.cloud.config.retry.initial-interval=1000
spring.cloud.config.retry.max-interval=2000
spring.cloud.config.retry.multiplier=1.1

# Fallback port if config-server is unreachable (overridden by config-repo).
server.port=8081

# DB schema is owned by Flyway; Hibernate just validates it matches what we expect.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# -----------------------------------------------------------------------------
# auth.jwt.* defaults
# -----------------------------------------------------------------------------
# These satisfy @Validated on JwtProperties when Config Server isn't reachable
# (during tests, or first-boot before config-server is up). In any real run
# config-repo/auth-service.properties overrides these.
# -----------------------------------------------------------------------------
auth.jwt.issuer=photoconnect
auth.jwt.audience=photoconnect-api
auth.jwt.access-token-ttl=PT15M
auth.jwt.refresh-token-ttl=P7D
auth.jwt.private-key-path=auth-service/keys/private_key.pem
auth.jwt.public-key-path=auth-service/keys/public_key.pem
