# =============================================================================
# auth-service - AWS profile (Phase 2)
# =============================================================================
# Fail-fast on missing config; AWS Secrets Manager will provide DB creds +
# JWT keys via spring-cloud-aws-starter-secrets-manager (added in Phase 2).
