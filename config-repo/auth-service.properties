# =============================================================================
# config-repo/auth-service.properties
# =============================================================================
# Served by config-service to auth-service. Single source of truth for DB
# connection, JWT issuer/keys, Redis, and per-service actuator exposure.
# =============================================================================

server.port=8081

# -----------------------------------------------------------------------------
# Datasource - PostgreSQL (auth_db)
# -----------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/auth_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
# HikariCP pool tuning (sensible local defaults)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000

# Flyway owns the schema
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# -----------------------------------------------------------------------------
# Redis (token blacklist)
# -----------------------------------------------------------------------------
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2s

# -----------------------------------------------------------------------------
# JWT settings (auth.jwt.* binds to JwtProperties record)
# -----------------------------------------------------------------------------
auth.jwt.issuer=photoconnect
auth.jwt.audience=photoconnect-api
# Durations use ISO-8601 (PT15M = 15 minutes, P7D = 7 days)
auth.jwt.access-token-ttl=PT15M
auth.jwt.refresh-token-ttl=P7D
# Filesystem paths to PEM keys generated by scripts/generate-keys.{sh,ps1}.
# Phase 2: these come from AWS Secrets Manager.
auth.jwt.private-key-path=${AUTH_PRIVATE_KEY_PATH:keys/private_key.pem}
auth.jwt.public-key-path=${AUTH_PUBLIC_KEY_PATH:keys/public_key.pem}

# -----------------------------------------------------------------------------
# OTP signup (app.otp.* binds to OtpProperties)
# -----------------------------------------------------------------------------
# provider:
#   dev   — DevModeOtpDeliveryService logs the code to stdout (Stage 1 default)
#   msg91 — Msg91OtpDeliveryService POSTs to MSG91 Flow API (Stage 2+)
# dev-mode (response-echo) is independent: when true, /otp/send returns the
# code in the response body. Useful for local tests against MSG91 sandbox
# numbers; MUST be false in prod.
app.otp.provider=${OTP_PROVIDER:dev}
app.otp.dev-mode=${OTP_DEV_MODE:true}
app.otp.length=6
app.otp.ttl=PT5M
app.otp.resend-cooldown=PT30S
app.otp.max-attempts=5

# MSG91 — only required when app.otp.provider=msg91. Leave the env vars unset
# in dev; OtpDeliveryConfig is @ConditionalOnProperty so these aren't validated
# unless msg91 is selected.
app.otp.msg91.base-url=${MSG91_BASE_URL:https://control.msg91.com}
app.otp.msg91.auth-key=${MSG91_AUTH_KEY:}
app.otp.msg91.template-id=${MSG91_TEMPLATE_ID:}
app.otp.msg91.sender-id=${MSG91_SENDER_ID:}

# -----------------------------------------------------------------------------
# Service-to-service clients (auth.service-clients.* binds to ServiceClientsProperties)
# -----------------------------------------------------------------------------
# Each clients.<clientId>.secret-hash is the BCrypt-12 hash of the cleartext
# secret presented by that calling service. Hashes are generated with
# BCryptPasswordEncoder(12) — same algorithm as user passwords.
#
# Tokens minted for these clients carry typ=service and the configured scope;
# they are validated by the receiving service via its own public key.
# -----------------------------------------------------------------------------
auth.service-clients.token-ttl=PT60S
auth.service-clients.clients.customer-service.secret-hash=${CUSTOMER_SERVICE_SECRET_HASH:$2a$12$BpjHB5L4sTzxkoIDQPG/mOrvVmCKjH8ziil.nEgvvGkZaceC53ppq}
auth.service-clients.clients.customer-service.scope=photographer-read

# reviews-service needs two scopes: photographer-read (to validate a photographer
# exists on review-create) and inquiry-read (the cross-service "completed
# booking" check it does against customer-service's /internal endpoint).
# The cleartext secret is "reviews-service-dev-secret" — matches reviews-service.properties.
auth.service-clients.clients.reviews-service.secret-hash=${REVIEWS_SERVICE_SECRET_HASH:$2a$12$ltrPCyYUbF373GV3hZdDPuWnVXiCQyZorfNXuhYo0gZkzUbOCRma2}
auth.service-clients.clients.reviews-service.scope=photographer-read,inquiry-read

# -----------------------------------------------------------------------------
# Service-level actuator additions (inherits health/info/metrics from
# the global config-repo/application.properties).
# -----------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus,refresh,env
management.endpoint.health.group.readiness.include=db,diskSpace,redis

# -----------------------------------------------------------------------------
# Swagger UI path (matches gateway aggregation pattern)
# -----------------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
