# =============================================================================
# config-repo/api-gateway.properties
# =============================================================================
# Served by config-service to the api-gateway. Single source of truth for
# routing, CORS, and Swagger aggregation. Change something here, hit
# api-gateway's /actuator/refresh, and the routes update without a restart.
#
# Note on .properties format for Gateway: list-of-objects config (routes,
# CORS, swagger urls) becomes deeply indexed. The verbosity is real - lists
# below use [N] for the index in arrays. Reorder carefully.
# =============================================================================

server.port=8080

# Add 'gateway' to inherited actuator exposure for inspecting/refreshing routes.
management.endpoints.web.exposure.include=health,info,metrics,prometheus,refresh,env,gateway
management.endpoint.gateway.access=read-only
management.tracing.sampling.probability=1.0

# -----------------------------------------------------------------------------
# Discovery Locator - auto /{serviceId}/** routes
# -----------------------------------------------------------------------------
# We keep this OFF in favor of explicit routes below. Explicit routes give us
# per-route filters, predicates, and circuit breakers - and don't leak
# internal service names into public URLs.
spring.cloud.gateway.discovery.locator.enabled=false
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# -----------------------------------------------------------------------------
# ROUTES
# -----------------------------------------------------------------------------
# Pattern:
#   id          : human label, shown in /actuator/gateway/routes
#   uri         : where to send it. lb://NAME means "load-balance to this
#                  Eureka service name"
#   predicates  : conditions to match the request
#   filters     : transformations along the way
# -----------------------------------------------------------------------------

# Route 0: auth-service (login, register, refresh)
# No JWT filter - these endpoints MUST be reachable without a token.
spring.cloud.gateway.routes[0].id=auth-service-route
spring.cloud.gateway.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/auth/**

# Route 1: photographer-service
spring.cloud.gateway.routes[1].id=photographer-service-route
spring.cloud.gateway.routes[1].uri=lb://PHOTOGRAPHER-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/photographers/**

# Route 2: customer-service - profile endpoints
spring.cloud.gateway.routes[2].id=customer-service-route
spring.cloud.gateway.routes[2].uri=lb://CUSTOMER-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/customers/**

# Route 3: customer-service - inquiry endpoints (same backend service)
# Split into a second route so each predicate carries a single Path (avoids
# the YAML "Path=A,B" comma trick which is awkward in .properties).
spring.cloud.gateway.routes[3].id=customer-inquiries-route
spring.cloud.gateway.routes[3].uri=lb://CUSTOMER-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/inquiries/**

# -----------------------------------------------------------------------------
# Aggregated Swagger - serve each service's OpenAPI spec via the gateway so
# the single Swagger UI can fetch them without CORS pain.
# Long-form filter (name + args) avoids ambiguity around the comma in the
# shorthand `RewritePath=regex,replacement` value.
# -----------------------------------------------------------------------------
spring.cloud.gateway.routes[4].id=auth-service-openapi
spring.cloud.gateway.routes[4].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/aggregate/auth-service/v3/api-docs
spring.cloud.gateway.routes[4].filters[0].name=RewritePath
spring.cloud.gateway.routes[4].filters[0].args.regexp=/aggregate/auth-service/v3/api-docs
spring.cloud.gateway.routes[4].filters[0].args.replacement=/v3/api-docs

spring.cloud.gateway.routes[5].id=photographer-service-openapi
spring.cloud.gateway.routes[5].uri=lb://PHOTOGRAPHER-SERVICE
spring.cloud.gateway.routes[5].predicates[0]=Path=/aggregate/photographer-service/v3/api-docs
spring.cloud.gateway.routes[5].filters[0].name=RewritePath
spring.cloud.gateway.routes[5].filters[0].args.regexp=/aggregate/photographer-service/v3/api-docs
spring.cloud.gateway.routes[5].filters[0].args.replacement=/v3/api-docs

spring.cloud.gateway.routes[6].id=customer-service-openapi
spring.cloud.gateway.routes[6].uri=lb://CUSTOMER-SERVICE
spring.cloud.gateway.routes[6].predicates[0]=Path=/aggregate/customer-service/v3/api-docs
spring.cloud.gateway.routes[6].filters[0].name=RewritePath
spring.cloud.gateway.routes[6].filters[0].args.regexp=/aggregate/customer-service/v3/api-docs
spring.cloud.gateway.routes[6].filters[0].args.replacement=/v3/api-docs

# -----------------------------------------------------------------------------
# GLOBAL CORS
# -----------------------------------------------------------------------------
# `[/**]` is a literal map key (the pattern) - the brackets escape special chars.
# Single edge configuration -> no CORS code in any downstream service.
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins[0]=http://localhost:5173
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins[1]=http://localhost:3000
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[0]=GET
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[1]=POST
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[2]=PUT
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[3]=PATCH
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[4]=DELETE
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[5]=OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].exposedHeaders[0]=X-Correlation-Id
spring.cloud.gateway.globalcors.cors-configurations.[/**].exposedHeaders[1]=Authorization
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].maxAge=3600

# -----------------------------------------------------------------------------
# JWT validation at the gateway edge
# -----------------------------------------------------------------------------
# Both auth-service and api-gateway must reference the SAME public key.
# The default (keys/public_key.pem) is relative to the service's working dir.
# Override AUTH_PUBLIC_KEY_PATH to an absolute path in your shell or Docker
# environment when the two services run in different directories.
# -----------------------------------------------------------------------------
gateway.jwt.public-key-path=${AUTH_PUBLIC_KEY_PATH:auth-service/keys/public_key.pem}
gateway.jwt.issuer=photoconnect
gateway.jwt.audience=photoconnect-api
# Paths that skip JWT validation (Ant patterns).
# Add new public endpoints here as they are built.
gateway.jwt.public-paths[0]=/api/v1/auth/**
gateway.jwt.public-paths[1]=/actuator/**
gateway.jwt.public-paths[2]=/swagger-ui.html
gateway.jwt.public-paths[3]=/swagger-ui/**
gateway.jwt.public-paths[4]=/v3/api-docs/**
gateway.jwt.public-paths[5]=/webjars/**
gateway.jwt.public-paths[6]=/aggregate/*/v3/api-docs

# -----------------------------------------------------------------------------
# Aggregated Swagger UI
# -----------------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls[0].name=auth-service
springdoc.swagger-ui.urls[0].url=/aggregate/auth-service/v3/api-docs
springdoc.swagger-ui.urls[1].name=photographer-service
springdoc.swagger-ui.urls[1].url=/aggregate/photographer-service/v3/api-docs
springdoc.swagger-ui.urls[2].name=customer-service
springdoc.swagger-ui.urls[2].url=/aggregate/customer-service/v3/api-docs
