# =============================================================================
# config-repo/application.properties
# =============================================================================
# GLOBAL DEFAULTS - served by config-service to EVERY PhotoConnect client
# service (api-gateway, auth-service, photographer-service, customer-service).
#
# Put cross-cutting config here: actuator, Eureka client basics, graceful
# shutdown, tracing endpoints. Service-specific overrides go in
# {service-name}.properties or {service-name}-{profile}.properties in this
# same folder.
#
# Note: this file does NOT apply to discovery-service or config-service
# themselves - those two are foundation services that boot from their own
# embedded properties. Everything else is a Config Server client.
# =============================================================================

# Lets in-flight HTTP requests finish during a SIGTERM (K8s rolling deploy).
server.shutdown=graceful
# Cap on graceful shutdown waiting time. After this, JVM is forcibly killed.
spring.lifecycle.timeout-per-shutdown-phase=30s

# -----------------------------------------------------------------------------
# Actuator - observability endpoints + tracing wiring
# -----------------------------------------------------------------------------
# Exposed deliberately, no more, no less:
#   health     : K8s liveness/readiness probes, monitoring uptime
#   info       : build/git metadata
#   metrics    : runtime metrics (memory, GC, HTTP, JDBC pool, ...)
#   prometheus : scrape endpoint when we wire Prometheus in Phase 2
#   refresh    : POST to reload @RefreshScope beans without restart
#   env        : useful for debugging config resolution (locked-down)
management.endpoints.web.exposure.include=health,info,metrics,prometheus,refresh,env
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
# Don't leak secrets via /actuator/env.
management.endpoint.env.show-values=never

# Distributed tracing - Micrometer -> Zipkin.
# Services that include `spring-boot-starter-actuator` +
# `micrometer-tracing-bridge-brave` + `zipkin-reporter-brave` pick this up
# automatically. 100% sampling in local; drop in aws to control cost.
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

# -----------------------------------------------------------------------------
# Eureka client defaults
# -----------------------------------------------------------------------------
# Any service that pulls in spring-cloud-starter-netflix-eureka-client gets
# these by default. discovery-service & config-service skip these (they don't
# include the Eureka client starter at all).
# -----------------------------------------------------------------------------
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
# Heartbeat every 10s (default 30); evict after 30s of no heartbeat.
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30
