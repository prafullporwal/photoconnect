# =============================================================================
# config-repo/reviews-service.properties
# =============================================================================
# Served by config-service to reviews-service. Source of truth for the
# PostgreSQL connection, port, actuator, and OpenFeign per-client tuning.
# =============================================================================

server.port=8084

# -----------------------------------------------------------------------------
# Datasource - PostgreSQL (reviews_db)
# -----------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/reviews_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000

# Flyway owns the schema
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# -----------------------------------------------------------------------------
# Actuator
# -----------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus,refresh,env
management.endpoint.health.group.readiness.include=db,diskSpace

# -----------------------------------------------------------------------------
# OpenFeign — per-client tuning
# -----------------------------------------------------------------------------
spring.cloud.openfeign.client.config.photographer-service.connect-timeout=2000
spring.cloud.openfeign.client.config.photographer-service.read-timeout=5000
spring.cloud.openfeign.client.config.photographer-service.logger-level=BASIC

spring.cloud.openfeign.client.config.customer-service.connect-timeout=2000
spring.cloud.openfeign.client.config.customer-service.read-timeout=5000
spring.cloud.openfeign.client.config.customer-service.logger-level=BASIC

# -----------------------------------------------------------------------------
# Service-to-service client (reviews.service-client.* → ServiceClientProperties)
# -----------------------------------------------------------------------------
# Mint a JWT from auth-service before each outbound Feign call. The cleartext
# secret here matches the BCrypt-12 hash registered in auth-service.properties
# under auth.service-clients.clients.reviews-service.secret-hash.
# -----------------------------------------------------------------------------
reviews.service-client.client-id=reviews-service
reviews.service-client.client-secret=${REVIEWS_SERVICE_SECRET:reviews-service-dev-secret}
reviews.service-client.auth-service-url=http://auth-service
reviews.service-client.refresh-skew=PT10S

# -----------------------------------------------------------------------------
# Swagger UI path (matches gateway aggregation pattern)
# -----------------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
