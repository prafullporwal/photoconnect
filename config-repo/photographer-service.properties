# =============================================================================
# config-repo/photographer-service.properties
# =============================================================================
# Served by config-service to photographer-service.
# Source of truth for DB connection, port, actuator exposure, etc.
# =============================================================================

server.port=8082

# -----------------------------------------------------------------------------
# Datasource - PostgreSQL (photographer_db)
# -----------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/photographer_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000

# Flyway owns the schema
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# -----------------------------------------------------------------------------
# Actuator
# -----------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus,refresh,env
management.endpoint.health.group.readiness.include=db,diskSpace

# -----------------------------------------------------------------------------
# Multipart file uploads (portfolio media)
# -----------------------------------------------------------------------------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=110MB

# -----------------------------------------------------------------------------
# Object storage (MinIO locally, S3 in Phase 2)
# -----------------------------------------------------------------------------
# Switching to real S3 is purely a properties change:
#   - blank/region-default endpoint
#   - publicUrlPrefix to a CloudFront distribution or s3.amazonaws.com
#   - real IAM credentials (or remove and use the SDK default chain)
#   - pathStyleAccess=false
# -----------------------------------------------------------------------------
storage.endpoint=${STORAGE_ENDPOINT:http://localhost:9000}
storage.public-url-prefix=${STORAGE_PUBLIC_URL:http://localhost:9000}
storage.bucket=${STORAGE_BUCKET:photoconnect-media}
storage.region=${STORAGE_REGION:us-east-1}
storage.access-key=${STORAGE_ACCESS_KEY:minioadmin}
storage.secret-key=${STORAGE_SECRET_KEY:minioadmin}
storage.path-style-access=true

# -----------------------------------------------------------------------------
# Swagger UI path (matches gateway aggregation pattern)
# -----------------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
