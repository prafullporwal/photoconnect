# =============================================================================
# config-repo/api-gateway.yml
# =============================================================================
# This config is served by config-service to the api-gateway. It's the
# "single source of truth" for routing and CORS. Change a route here, hit
# api-gateway's /actuator/refresh, and routing updates without a restart.
# =============================================================================

server:
  port: 8080

# Actuator exposure — add 'gateway' to inspect/refresh routes
management:
  endpoints:
    web:
      exposure:
        # Inherits health,info,metrics,prometheus,refresh,env from
        # application.yml; we add 'gateway' (route inspection/manipulation).
        include: health,info,metrics,prometheus,refresh,env,gateway
  endpoint:
    gateway:
      access: read-only
  tracing:
    sampling:
      probability: 1.0

# -----------------------------------------------------------------------------
# Spring Cloud Gateway: routes + CORS + discovery integration
# -----------------------------------------------------------------------------
spring:
  cloud:
    gateway:
      # ---- DISCOVERY LOCATOR (auto-create /{serviceId}/** routes) ----
      # We KEEP this OFF in favor of explicit routes below. Explicit routes
      # give us per-route filters, predicates, and circuit breakers — and
      # don't leak internal service names into public URLs.
      discovery:
        locator:
          enabled: false
          lower-case-service-id: true

      # ---- ROUTES ----
      # Pattern:
      #   id          : human label, shown in /actuator/gateway/routes
      #   predicates  : conditions to match the request
      #   uri         : where to send it. lb://NAME means "load-balance to
      #                  this Eureka service name"
      #   filters     : transformations along the way
      routes:
        # ---- auth-service (login, register, refresh) ----
        - id: auth-service-route
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/v1/auth/**
          # No JWT filter — these endpoints MUST be reachable without a token.

        # ---- photographer-service ----
        - id: photographer-service-route
          uri: lb://PHOTOGRAPHER-SERVICE
          predicates:
            - Path=/api/v1/photographers/**

        # ---- customer-service: profiles + inquiries ----
        - id: customer-service-route
          uri: lb://CUSTOMER-SERVICE
          predicates:
            - Path=/api/v1/customers/**,/api/v1/inquiries/**

        # ---- Aggregated Swagger: serve each service's OpenAPI spec
        #      via the gateway, so the single Swagger UI can fetch them
        #      without CORS pain. ----
        - id: auth-service-openapi
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/aggregate/auth-service/v3/api-docs
          filters:
            - RewritePath=/aggregate/auth-service/v3/api-docs, /v3/api-docs

        - id: photographer-service-openapi
          uri: lb://PHOTOGRAPHER-SERVICE
          predicates:
            - Path=/aggregate/photographer-service/v3/api-docs
          filters:
            - RewritePath=/aggregate/photographer-service/v3/api-docs, /v3/api-docs

        - id: customer-service-openapi
          uri: lb://CUSTOMER-SERVICE
          predicates:
            - Path=/aggregate/customer-service/v3/api-docs
          filters:
            - RewritePath=/aggregate/customer-service/v3/api-docs, /v3/api-docs

      # ---- GLOBAL CORS ----
      # Single edge configuration → no CORS code in any downstream service.
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - http://localhost:5173      # Vite dev (React frontend)
              - http://localhost:3000      # CRA fallback
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: '*'
            exposedHeaders:
              - X-Correlation-Id
              - Authorization
            allowCredentials: true
            maxAge: 3600

# -----------------------------------------------------------------------------
# Aggregated Swagger UI — one dropdown that switches between service specs
# -----------------------------------------------------------------------------
# Once auth/photographer/customer services come online, each one's spec
# becomes selectable from /swagger-ui.html on the gateway.
# -----------------------------------------------------------------------------
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: auth-service
        url: /aggregate/auth-service/v3/api-docs
      - name: photographer-service
        url: /aggregate/photographer-service/v3/api-docs
      - name: customer-service
        url: /aggregate/customer-service/v3/api-docs
