# =============================================================================
# config-repo/customer-service.properties
# =============================================================================
# Served by config-service to customer-service. Source of truth for the MySQL
# connection, port, actuator, and OpenFeign per-client tuning.
# =============================================================================

server.port=8083

# -----------------------------------------------------------------------------
# Datasource - MySQL (customer_db)
# -----------------------------------------------------------------------------
# Note serverTimezone=UTC: we always store UTC Instants so the JDBC driver
# must not apply a session timezone conversion. allowPublicKeyRetrieval=true
# is convenient for local dev with the default MySQL caching_sha2 plugin.
spring.datasource.url=jdbc:mysql://localhost:3306/customer_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=customer_user
spring.datasource.password=customer_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000

# Flyway owns the schema
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# -----------------------------------------------------------------------------
# Actuator
# -----------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus,refresh,env
management.endpoint.health.group.readiness.include=db,diskSpace

# -----------------------------------------------------------------------------
# OpenFeign — per-client tuning for the photographer-service caller
# -----------------------------------------------------------------------------
# Keep connect-timeout very short: we hit a service on the same Docker network,
# so anything over 1-2s means it's down. Read timeout slightly higher to allow
# for downstream DB queries.
spring.cloud.openfeign.client.config.photographer-service.connect-timeout=2000
spring.cloud.openfeign.client.config.photographer-service.read-timeout=5000
# Log every Feign request/response at the BASIC level: status code + URL only.
# (NONE | BASIC | HEADERS | FULL) — BASIC is the sweet spot for diagnosing 4xx/5xx.
spring.cloud.openfeign.client.config.photographer-service.logger-level=BASIC

# -----------------------------------------------------------------------------
# Swagger UI path (matches gateway aggregation pattern)
# -----------------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
