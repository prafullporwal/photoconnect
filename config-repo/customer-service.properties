# =============================================================================
# config-repo/customer-service.properties
# =============================================================================
# Served by config-service to customer-service. Source of truth for the MySQL
# connection, port, actuator, and OpenFeign per-client tuning.
# =============================================================================

server.port=8083

# -----------------------------------------------------------------------------
# Datasource - MySQL (customer_db)
# -----------------------------------------------------------------------------
# Note serverTimezone=UTC: we always store UTC Instants so the JDBC driver
# must not apply a session timezone conversion. allowPublicKeyRetrieval=true
# is convenient for local dev with the default MySQL caching_sha2 plugin.
spring.datasource.url=jdbc:mysql://localhost:3306/customer_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=customer_user
spring.datasource.password=customer_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000

# Flyway owns the schema
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# -----------------------------------------------------------------------------
# Actuator
# -----------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus,refresh,env
management.endpoint.health.group.readiness.include=db,diskSpace

# -----------------------------------------------------------------------------
# OpenFeign — per-client tuning for the photographer-service caller
# -----------------------------------------------------------------------------
# Keep connect-timeout very short: we hit a service on the same Docker network,
# so anything over 1-2s means it's down. Read timeout slightly higher to allow
# for downstream DB queries.
spring.cloud.openfeign.client.config.photographer-service.connect-timeout=2000
spring.cloud.openfeign.client.config.photographer-service.read-timeout=5000
# Log every Feign request/response at the BASIC level: status code + URL only.
# (NONE | BASIC | HEADERS | FULL) — BASIC is the sweet spot for diagnosing 4xx/5xx.
spring.cloud.openfeign.client.config.photographer-service.logger-level=BASIC

# -----------------------------------------------------------------------------
# Service-to-service client (customer.service-client.* → ServiceClientProperties)
# -----------------------------------------------------------------------------
# We mint a JWT from auth-service before each outbound Feign call. The cleartext
# secret here matches the BCrypt-12 hash registered in auth-service.properties
# under auth.service-clients.clients.customer-service.secret-hash.
#
# refreshSkew: re-mint when the cached token has less than this much life left.
# With TTL=60s and skew=10s, a JVM mints roughly once every 50 seconds.
# -----------------------------------------------------------------------------
customer.service-client.client-id=customer-service
customer.service-client.client-secret=${CUSTOMER_SERVICE_SECRET:customer-service-dev-secret}
customer.service-client.auth-service-url=http://auth-service
customer.service-client.refresh-skew=PT10S

# -----------------------------------------------------------------------------
# Service-to-service JWT verification (customer.service-jwt.* → ServiceJwtProperties)
# -----------------------------------------------------------------------------
# Used by ServiceTokenAuthenticationFilter on inbound /internal/** requests
# (currently reviews-service calling /internal/v1/inquiries/completed).
# Issuer + audience MUST match the values configured on auth-service.
# -----------------------------------------------------------------------------
customer.service-jwt.issuer=photoconnect
customer.service-jwt.audience=photoconnect-api
customer.service-jwt.public-key-path=${AUTH_PUBLIC_KEY_PATH:auth-service/keys/public_key.pem}

# -----------------------------------------------------------------------------
# Swagger UI path (matches gateway aggregation pattern)
# -----------------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
