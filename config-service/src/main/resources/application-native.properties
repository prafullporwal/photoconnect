# =============================================================================
# config-service - NATIVE backend configuration
# =============================================================================
# Auto-activated by the profile-group mapping `local -> native`. Spring Cloud
# Config picks up the `native` profile and wires the NativeEnvironmentRepository,
# which reads YAML/properties files from the search-locations below.
#
# ${user.dir} = JVM working directory. Two candidate paths so the Config Server
# works whether you launch from the repo root or from the config-service dir.
# Missing locations are silently skipped.
# =============================================================================

spring.cloud.config.server.native.search-locations[0]=file:${user.dir}/config-repo
spring.cloud.config.server.native.search-locations[1]=file:${user.dir}/../config-repo
