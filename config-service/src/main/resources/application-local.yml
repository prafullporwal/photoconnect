# =============================================================================
# config-service — LOCAL profile
# =============================================================================
# Activated by `spring.profiles.active=local` (or its absence — local is the
# default). The profile-group in application.yml automatically also activates
# the `native` profile, which causes application-native.yml below to be loaded
# and the NativeEnvironmentRepository to be wired.
#
# This file is intentionally small: env-specific tweaks only. The actual
# backend configuration lives in application-native.yml so the same backend
# file can be reused independently of the environment.
# =============================================================================

logging:
  level:
    root: INFO
    org.springframework.cloud.config.server: INFO
    com.photoconnect: DEBUG
