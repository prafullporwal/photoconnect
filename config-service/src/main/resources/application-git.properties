# =============================================================================
# config-service - GIT backend configuration (Phase 2)
# =============================================================================
# Auto-activated by the profile-group mapping `aws -> git`. Two complementary
# backends are typical in production:
#   1. Git backend (this file) - non-secret YAML/properties config in a
#      version-controlled repo (audit log + rollback + PR reviews).
#   2. AWS Secrets Manager / Parameter Store - secrets only.
# =============================================================================

spring.cloud.config.server.git.uri=${CONFIG_GIT_URI:https://github.com/your-org/photoconnect-config}
spring.cloud.config.server.git.default-label=main
# Private repos: set CONFIG_GIT_USERNAME / CONFIG_GIT_PASSWORD
spring.cloud.config.server.git.username=${CONFIG_GIT_USERNAME:}
spring.cloud.config.server.git.password=${CONFIG_GIT_PASSWORD:}
spring.cloud.config.server.git.clone-on-start=true
spring.cloud.config.server.git.timeout=10
